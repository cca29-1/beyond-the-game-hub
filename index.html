function downloadResponse(p,d){const date=new Date().toLocaleDateString('en-GB');const paragraphs=wordParagraph('BEYOND THE GAME','Title')+wordParagraph('OCR A Level PE · Paper '+(p.paper||'3')+' · Topic '+(p.unit||''),'Subtitle')+wordParagraph(p.title,'Heading1')+wordParagraph('Activity: '+d.reason)+wordParagraph('Date: '+date)+wordParagraph('RESOURCE QUESTION','Heading2')+wordParagraph(p.question)+wordParagraph('STUDENT RESPONSE','Heading2')+wordParagraph(d.response);const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paragraphs}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1200" w:right="1300" w:bottom="1200" w:left="1300"/></w:sectPr></w:body></w:document>`;const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos"/><w:sz w:val="22"/></w:rPr><w:pPr><w:spacing w:after="150"/></w:pPr></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:rPr><w:b/><w:color w:val="142B4A"/><w:sz w:val="34"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Subtitle"><w:name w:val="Subtitle"/><w:rPr><w:color w:val="547080"/><w:sz w:val="20"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:rPr><w:b/><w:color w:val="142B4A"/><w:sz w:val="28"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:rPr><w:b/><w:color w:val="276783"/><w:sz w:val="22"/></w:rPr></w:style></w:styles>`;const entries=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],['word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],['word/document.xml',documentXml],['word/styles.xml',styles]];let blob=zipStore(entries),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Beyond_the_Game_${String(p.id).replace(/[^a-z0-9_-]/gi,'_')}_response.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
function downloadCurrent(){const p=getPost(state.current);const d=saveDraft();if(!p||!d)return;if(!d.response.trim()){toast('Write a response before downloading.');document.getElementById('response').focus();return}downloadResponse(p,d);document.getElementById('downloadMessage').innerHTML='<div class="ok">Word document downloaded. You can edit it in Word and upload the file to a Teams assignment or send it to your tutor if requested. Nothing has been submitted automatically.</div>';}
function bindEvents(){document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){const post=getPost(b.dataset.open);if(post)state.paper=String(post.paper||'3');navigate(b.dataset.open);return}if(b.dataset.paper){state.paper=b.dataset.paper;state.topic='All topics';state.kind='All formats';state.query='';state.current=null;history.pushState(null,'','#paper/'+state.paper);render();window.scrollTo(0,0);return}if(b.dataset.save){toggle('saved',b.dataset.save);return}if(b.dataset.done){toggle('done',b.dataset.done);return}if(b.dataset.topic){state.topic=b.dataset.topic;render();return}if(b.dataset.mode){state.mode=b.dataset.mode;state.current=null;history.pushState(null,'','#paper/'+state.paper);render();return}if(b.id==='back'){navigate(null);return}if(b.id==='retryFeed'){loadFeed();return}if(b.id==='clearFilters'){state.topic='All topics';state.kind='All formats';state.query='';render();return}if(b.id==='saveDraft'){saveDraft();toast('Draft saved on this device');return}if(b.id==='downloadResponse'){downloadCurrent();return}if(b.id==='share'){let url=location.href;navigator.clipboard?.writeText(url).then(()=>toast('Post link copied')).catch(()=>toast('Copy the page URL from your browser'));return}});document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;state.query=e.target.value;render();let field=document.getElementById('search');field.focus();field.setSelectionRange(pos,pos)}if(e.target.id==='response'&&state.current){const p=getPost(state.current);state.drafts[p.id]={response:e.target.value,reason:document.getElementById('reason').value,updated:new Date().toISOString()};put('drafts',state.drafts);document.getElementById('draftStatus').textContent='Draft autosaved on this device'}});document.addEventListener('change',e=>{if(e.target.id==='format'){state.kind=e.target.value;render()}if(e.target.id==='reason'&&state.current)saveDraft()});window.addEventListener('popstate',route);window.addEventListener('hashchange',route)}
// Staff resources are already filtered to Published in the Microsoft Lists automation.
// Published Microsoft Lists resources are the only source of posts.
function topicChoices(paper){
  const existing=TOPICS[paper]||[['All topics','✦']];
  const names=new Set(existing.map(x=>x[0]));
  return [...existing,...state.posts.filter(x=>String(x.paper)===String(paper)&&!names.has(x.topic)).map(x=>x.topic).filter((v,i,a)=>v&&a.indexOf(v)===i).map(name=>[name,'✦'])];
}
function normaliseResource(p){
  if(!p || p.id===undefined || p.id===null || !p.title)return null;
  const paperString=String(p.paper??'3');
  const paper=(paperString.match(/\b[123]\b/)||[])[0]||'3';
  const type=typeof p.type==='object'?(p.type?.Value||'Explore'):(p.type||'Explore');
  const topic=String(p.topic||'Other topic');
  const unit=(topic.match(/\b[123]\.[123]\b/)||[])[0]||paper+'.1';
  return {id:'list-'+String(p.id),title:String(p.title),paper,topic,type:String(type),
    summary:String(p.description||p.summary||''),question:String(p.question||''),
    url:safeUrl(p.url),source:String(p.source||type),keywords:String(p.keywords||''),
    unit,symbol:({Podcast:'🎙',Video:'▶',Article:'📖',Research:'🔬',Debate:'💬'})[type]||'✦',
    tone:paper==='1'?'teal':paper==='2'?'violet':'blue',cover:safeUrl(p.image||p.cover),
    readingTime:String(p.duration||p.readingTime||'Independent learning'),featured:p.featured===true,
    status:'Published'};
}
async function loadFeed(){
  try{
    const url=CONFIG.RESOURCE_FEED_URL;
    if(!url)return;
    state.feedLoading=true;state.feedError=false;render();
    const resp=await fetch(url,{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    if(!Array.isArray(data))throw new Error('Expected a resource array');
    const incoming=data.filter(p=>p&&p.status!=='Draft'&&p.status!=='Archived')
      .map(normaliseResource).filter(Boolean);
    state.posts=incoming;
    state.feedError=false;state.feedLoading=false;
    route();
  }catch(e){
    console.error('Resource feed unavailable',e);
    state.feedError=true;state.feedLoading=false;state.feedErrorMessage=String(e.message||e);render();
  }
}

bindEvents();route();loadFeed();
